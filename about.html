<script src="data.js"></script>
<script>
(function() {
  // publisher 정보는 data.js 안에 같이 들어있음
  const P = (window.NEWSPAPER && window.NEWSPAPER.publisher) || {};

  function setText(sel, t) {
    const el = document.querySelector(sel);
    if (el && t) el.textContent = t;
  }
  function setHTML(sel, paragraphs) {
    const el = document.querySelector(sel);
    if (!el || !paragraphs) return;
    el.innerHTML = paragraphs.split(/\n\s*\n/).map(p => `<p>${p.replace(/</g,'&lt;')}</p>`).join('');
  }

  if (P.name) setText('[data-publisher-name]', P.name);
  if (P.title) setText('[data-publisher-title]', P.title);
  if (P.tagline) setText('[data-publisher-tagline]', P.tagline);
  if (P.founded) setText('[data-publisher-founded]', P.founded.replace(/-/g, '.'));
  if (P.intro) setHTML('[data-publisher-intro]', P.intro);
  if (P.philosophy) setHTML('[data-publisher-philosophy]', P.philosophy);

  // 사진 처리
  if (P.photo) {
    const area = document.getElementById('publisher-photo-area');
    area.innerHTML = '<img class="photo" src="' + P.photo + '" alt="">';
  }
})();
</script>
