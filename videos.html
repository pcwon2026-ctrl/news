<body>
<div class="paper">

  <div class="top-strip">
    <span data-issue></span>
    <span>창간 2026년 1월 1일</span>
    <span data-today></span>
  </div>

  <header class="masthead">
    <h1><a href="index.html">한국정치경제신문</a></h1>
    <p class="tagline">정확한 사실 · 깊은 시각</p>
  </header>

  <nav class="nav">
    <a href="index.html">1 면</a>
    <a href="archive.html">아 카 이 브</a>
    <a href="videos.html">뉴 스 영 상</a>
    <a href="about.html">발 행 인</a>
  </nav>

  <header class="page-header" style="text-align:center;padding:30px 0 20px;border-bottom:1px solid var(--ink)">
    <h1 style="font-family:var(--serif-display);font-size:32px;letter-spacing:8px;margin:0">뉴 스 영 상</h1>
    <p style="margin-top:8px;color:var(--ink-mute);font-style:italic;font-size:14px">매일의 흐름을 영상으로 만나보세요</p>
  </header>

  <main>
    <div class="video-cards" data-video-list></div>
  </main>

  <footer>
    <span>한국정치경제신문 · 발행인 박창원</span>
    <span>© 2026 본지 무단 전재·재배포 금지</span>
  </footer>

</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>
(function() {
  const D = window.NEWSPAPER || {};
  const articles = D.articles || [];
  const videos = articles.filter(a => a.video && a.video.trim());
  // 최신순 정렬
  videos.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const list = document.querySelector('[data-video-list]');
  if (!videos.length) {
    list.innerHTML = '<p style="text-align:center;padding:60px;color:var(--ink-mute);font-style:italic">아직 등록된 뉴스영상이 없습니다.</p>';
    return;
  }

  const escAttr = s => String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const escText = s => String(s || '').replace(/</g, '&lt;');

  list.innerHTML = videos.map(a => {
    const v = window.parseVideoUrl(a.video);
    const thumb = v && v.thumb
      ? `<img src="${v.thumb}" alt="">`
      : '<div style="width:100%;height:100%;background:#1a1a1a"></div>';
    const date = (a.date || '').replace(/-/g, '.');
    return `
      <div class="video-card">
        <a href="articles/${a.id}.html">
          <div class="thumb-wrap">
            ${thumb}
            <div class="play-icon">▶</div>
          </div>
          <div class="info">
            <span class="dept-mini dept-${a.dept || ''}">${escText(a.dept || '')}</span>
            <h3>${escText(a.headline || '')}</h3>
            <p class="meta">${date}</p>
          </div>
        </a>
      </div>
    `;
  }).join('');
})();
</script>
</body>
</html>
